<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>侧边栏菜单测试</title>
    <style>
        /* 重置样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 主布局 */
        .layout {
            height: 100vh;
            display: flex;
        }

        /* 左侧导航栏 */
        .sidebar {
            width: 260px;
            background: linear-gradient(180deg, #2c3e50 0%, #34495e 100%);
            color: #ecf0f1;
            height: 100vh;
            overflow-y: auto;
            flex-shrink: 0;
            position: relative;
            transition: width 0.3s ease;
            box-shadow: 2px 0 8px rgba(0, 0, 0, 0.1);
        }

        .logo {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #4a5c6a;
            background: rgba(52, 73, 94, 0.8);
        }

        .logo-icon {
            font-size: 24px;
            margin-right: 10px;
        }

        .logo-text {
            margin: 0;
            color: #3498db;
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
        }

        .nav-menu {
            padding: 10px 0;
        }

        .menu-group {
            margin-bottom: 20px;
        }

        .group-title {
            padding: 8px 20px;
            font-size: 12px;
            color: #95a5a6;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
            border-bottom: 1px solid #4a5c6a;
            margin-bottom: 5px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            padding: 12px 20px;
            color: #ecf0f1;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
        }

        .nav-item:hover {
            background: rgba(52, 152, 219, 0.1);
            color: #3498db;
            padding-left: 25px;
        }

        .nav-item.active {
            background: linear-gradient(90deg, #3498db, #2980b9);
            color: #fff;
            border-left: 4px solid #e74c3c;
            box-shadow: 0 2px 8px rgba(52, 152, 219, 0.3);
        }

        .nav-icon {
            font-size: 16px;
            margin-right: 12px;
            width: 20px;
            text-align: center;
            flex-shrink: 0;
        }

        .nav-text {
            flex: 1;
            font-size: 14px;
            white-space: nowrap;
        }

        /* 右侧主内容区域 */
        .main-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .main-content {
            flex: 1;
            background-color: #f5f7fa;
            padding: 20px;
            overflow-y: auto;
        }

        .test-info {
            background: #e8f5e8;
            border: 1px solid #4caf50;
            border-radius: 4px;
            padding: 15px;
            margin-bottom: 20px;
        }

        .test-info h2 {
            color: #2e7d32;
            margin-bottom: 10px;
        }

        .test-info p {
            color: #1b5e20;
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="layout">
        <!-- 左侧导航栏 -->
        <div class="sidebar">
            <div class="logo">
                <div class="logo-icon">🏪</div>
                <h2 class="logo-text">店铺管理系统</h2>
            </div>
            
            <nav class="nav-menu">
                <div class="menu-group">
                    <div class="group-title">工作台</div>
                    <a class="nav-item active">
                        <span class="nav-icon">📊</span>
                        <span class="nav-text">仪表盘</span>
                    </a>
                </div>
                
                <div class="menu-group">
                    <div class="group-title">商品管理</div>
                    <a class="nav-item">
                        <span class="nav-icon">📦</span>
                        <span class="nav-text">商品管理</span>
                    </a>
                    <a class="nav-item">
                        <span class="nav-icon">📁</span>
                        <span class="nav-text">分类管理</span>
                    </a>
                </div>
                
                <div class="menu-group">
                    <div class="group-title">订单管理</div>
                    <a class="nav-item">
                        <span class="nav-icon">📋</span>
                        <span class="nav-text">订单管理</span>
                    </a>
                </div>
                
                <div class="menu-group">
                    <div class="group-title">客户管理</div>
                    <a class="nav-item">
                        <span class="nav-icon">👥</span>
                        <span class="nav-text">会员管理</span>
                    </a>
                </div>
                
                <div class="menu-group">
                    <div class="group-title">销售管理</div>
                    <a class="nav-item">
                        <span class="nav-icon">💰</span>
                        <span class="nav-text">POS收银</span>
                    </a>
                </div>
                
                <div class="menu-group">
                    <div class="group-title">数据统计</div>
                    <a class="nav-item">
                        <span class="nav-icon">📈</span>
                        <span class="nav-text">数据统计</span>
                    </a>
                </div>
                
                <div class="menu-group">
                    <div class="group-title">系统管理</div>
                    <a class="nav-item">
                        <span class="nav-icon">👤</span>
                        <span class="nav-text">用户管理</span>
                    </a>
                    <a class="nav-item">
                        <span class="nav-icon">⚙️</span>
                        <span class="nav-text">系统设置</span>
                    </a>
                    <a class="nav-item">
                        <span class="nav-icon">👤</span>
                        <span class="nav-text">个人资料</span>
                    </a>
                </div>
            </nav>
        </div>
        
        <!-- 右侧主内容区域 -->
        <div class="main-container">
            <div class="main-content">
                <div class="test-info">
                    <h2>侧边栏菜单测试页面</h2>
                    <p>这是一个静态的侧边栏菜单测试页面，用于验证HTML结构和CSS样式是否正确。</p>
                    <p>如果您能看到左侧的侧边栏菜单，说明样式是正常的。</p>
                    <p>如果看不到，请检查CSS是否正确加载。</p>
                </div>
                
                <h1>测试内容</h1>
                <p>这是主内容区域，用于测试布局是否正确。</p>
                
                <h3>测试项目：</h3>
                <ul>
                    <li>侧边栏是否显示</li>
                    <li>菜单项是否正确显示</li>
                    <li>样式是否正确应用</li>
                    <li>布局是否响应式</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        // 简单的交互测试
        document.addEventListener('DOMContentLoaded', function() {
            const navItems = document.querySelectorAll('.nav-item');
            
            navItems.forEach(item => {
                item.addEventListener('click', function() {
                    // 移除所有active类
                    navItems.forEach(nav => nav.classList.remove('active'));
                    // 添加active类到当前点击的项
                    this.classList.add('active');
                    
                    console.log('点击了菜单项:', this.querySelector('.nav-text').textContent);
                });
            });
            
            console.log('侧边栏菜单测试页面已加载');
            console.log('菜单项数量:', navItems.length);
        });
    </script>
</body>
</html>
