<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>左侧菜单测试</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="layout">
        <!-- 左侧导航栏 -->
        <div class="sidebar">
            <div class="logo">
                <h2>🏪 Shop Manager</h2>
            </div>
            
            <nav class="nav-menu">
                <a href="#dashboard" class="nav-item active">📊 仪表盘</a>
                <a href="#shops" class="nav-item">🏪 店铺管理</a>
                <a href="#products" class="nav-item">📦 商品管理</a>
                <a href="#categories" class="nav-item">📁 分类管理</a>
                <a href="#orders" class="nav-item">📋 订单管理</a>
                <a href="#members" class="nav-item">👥 会员管理</a>
                <a href="#pos" class="nav-item">💰 POS收银</a>
                <a href="#statistics" class="nav-item">📈 数据统计</a>
                <a href="#settings" class="nav-item">⚙️ 系统设置</a>
            </nav>
        </div>
        
        <!-- 右侧主内容区域 -->
        <div class="main-container">
            <!-- 顶部用户信息栏 -->
            <div class="top-header">
                <div class="header-content">
                    <div class="breadcrumb">
                        首页 / 仪表盘
                    </div>
                    
                    <div class="user-info">
                        <span class="username">用户</span>
                        <button class="logout-btn" onclick="logout()">退出登录</button>
                    </div>
                </div>
            </div>
            
            <!-- 主要内容区域 -->
            <div class="main-content">
                <div id="dashboard" class="page active">
                    <h1>仪表盘</h1>
                    <p>欢迎使用店铺管理系统</p>
                    <div class="quick-actions">
                        <h3>快速操作</h3>
                        <div class="action-buttons">
                            <button onclick="showPage('products')">商品管理</button>
                            <button onclick="showPage('orders')">订单管理</button>
                            <button onclick="showPage('members')">会员管理</button>
                        </div>
                    </div>
                </div>
                
                <div id="products" class="page">
                    <h1>商品管理</h1>
                    <p>商品管理功能开发中...</p>
                    <button onclick="showPage('dashboard')">返回仪表盘</button>
                </div>
                
                <div id="orders" class="page">
                    <h1>订单管理</h1>
                    <p>订单管理功能开发中...</p>
                    <button onclick="showPage('dashboard')">返回仪表盘</button>
                </div>
                
                <div id="members" class="page">
                    <h1>会员管理</h1>
                    <p>会员管理功能开发中...</p>
                    <button onclick="showPage('dashboard')">返回仪表盘</button>
                </div>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
