services:
  mysql:
    image: mysql:8.0
    container_name: shop-manager-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: shop_manager
      MYSQL_USER: shopuser
      MYSQL_PASSWORD: shoppassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - shop-network

  redis:
    image: redis:6.0-alpine
    container_name: shop-manager-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - shop-network

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: shop-manager-backend
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://shopuser:shoppassword@mysql:3306/shop_manager
      REDIS_URL: redis://redis:6379
      JWT_SECRET: your-super-secret-jwt-key
    ports:
      - "3001:3001"
    depends_on:
      - mysql
      - redis
    networks:
      - shop-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: shop-manager-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - shop-network

  nginx:
    image: nginx:alpine
    container_name: shop-manager-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    networks:
      - shop-network

volumes:
  mysql_data:
  redis_data:

networks:
  shop-network:
    driver: bridge